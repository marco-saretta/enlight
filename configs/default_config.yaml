# ENLIGHT Model - Global Configuration
#
# Global settings shared across all simulations.
# Simulation-specific parameters live in configs/simulations/<name>.yaml.
#
# Single sim:  python main.py simulations=sim_1
# Multi-run:   uncomment the hydra block at the bottom of this file

defaults:
  - simulations: _template   # active simulation config (single-sim mode)
  - entsoe_api_key: placeholder
  - _self_

# Paths
# paths.log is consumed by setup_logging() in utils.py.
paths:
  root: "${hydra:runtime.cwd}"
  log:  "${hydra:runtime.cwd}/logs"

# Solver
# gurobi : commercial, high performance, requires a valid license
# highs  : open-source, no license required
solver_name: highs

# Bidding zones
# Comment out zones to exclude them. Each active zone must have input data.
bidding_zones:

  # EU member states
  - AT   # Austria
  - BE   # Belgium
  # - BG   # Bulgaria
  # - CZ   # Czech Republic
  # - DELU # Germany and Luxembourg
  # - DK1  # Denmark West
  # - DK2  # Denmark East
  # - EE   # Estonia
  # - EL   # Greece
  # - ES   # Spain
  # - FI   # Finland
  - FR   # France
  # - HR   # Croatia
  # - HU   # Hungary
  - IT   # Italy
  # - LT   # Lithuania
  # - LV   # Latvia
  # - NL   # Netherlands
  # - PL   # Poland
  # - PT   # Portugal
  # - RO   # Romania
  # - SE1  # Sweden Zone 1
  # - SE2  # Sweden Zone 2
  # - SE3  # Sweden Zone 3
  # - SE4  # Sweden Zone 4
  # - SEM  # Single Electricity Market (Ireland & Northern Ireland)
  # - SI   # Slovenia
  # - SK   # Slovakia

  # Extra-EU bidding zones
  - CH   # Switzerland
  # - AL   # Albania
  # - BA   # Bosnia and Herzegovina
  # - GB   # Great Britain
  # - ME   # Montenegro
  # - MK   # North Macedonia
  # - NO1  # Norway Zone 1
  # - NO2  # Norway Zone 2
  # - NO3  # Norway Zone 3
  # - NO4  # Norway Zone 4
  # - NO5  # Norway Zone 5
  # - RS   # Serbia
  # - XK   # Kosovo

# Multi-run mode
# Run all configs:      python main.py --multirun simulations='glob(*)'
# Run selected configs: python main.py --multirun simulations=sim_1,sim_2
#
# hydra:
#   mode: MULTIRUN
#   sweeper:
#     params:
#       simulations: glob(*)