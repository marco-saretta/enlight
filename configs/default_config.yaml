# =============================================================================
# ENLIGHT Model — Global Configuration
# =============================================================================
# Global settings shared across all simulations.
# Simulation-specific parameters live in configs/simulation/<name>.yaml.
#
# Single sim:  python main.py simulation=sim1
# Batch run:   python main.py  (uses simulation_list below)
# =============================================================================

defaults:
  - simulations: _template   # active simulation when running in single-sim mode
  - entsoe_api_key: placeholder
  - _self_

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  root: "${hydra:runtime.cwd}"
  log:  "${hydra:runtime.cwd}/logs"

# -----------------------------------------------------------------------------
# Solver
# -----------------------------------------------------------------------------
# gurobi : commercial, high performance, requires license
# highs  : open-source, no license required
# -----------------------------------------------------------------------------
solver_name: highs

# -----------------------------------------------------------------------------
# Multi-run mode
# -----------------------------------------------------------------------------
# List simulation config names (without .yaml) to run sequentially.
# Leave empty to run only the simulation selected in `defaults` above.
# -----------------------------------------------------------------------------

# hydra:
#   mode: MULTIRUN
#   sweeper:
#     params:
#       simulations: glob(*)      # Iterate over all the simulation files
#       simulations: sim_1, sim_2 # Iterate over selected simulation files

job_logging:
  handlers:
    file:
      filename: logs/enlight.log

# -----------------------------------------------------------------------------
# Bidding zones
# -----------------------------------------------------------------------------
# European electricity market zones included in the simulation.
# Comment out zones to exclude them. Each zone requires corresponding input data.
# -----------------------------------------------------------------------------
bidding_zones:

  # --- EU member states (alphabetical) ---
  - AT   # Austria
  - BE   # Belgium
  # - BG   # Bulgaria
  # - CZ   # Czech Republic
  # - DELU # Germany and Luxembourg
  # - DK1  # Denmark West
  # - DK2  # Denmark East
  # - EE   # Estonia
  # - EL   # Greece
  # - ES   # Spain
  # - FI   # Finland
  - FR   # France
  # - HR   # Croatia
  # - HU   # Hungary
  - IT   # Italy
  # - LT   # Lithuania
  # - LV   # Latvia
  # - NL   # Netherlands
  # - PL   # Poland
  # - PT   # Portugal
  # - RO   # Romania
  # - SE1  # Sweden Zone 1
  # - SE2  # Sweden Zone 2
  # - SE3  # Sweden Zone 3
  # - SE4  # Sweden Zone 4
  # - SEM  # Single Electricity Market (Ireland & Northern Ireland)
  # - SI   # Slovenia
  # - SK   # Slovakia

  # --- Extra-EU bidding zones (alphabetical) ---
  - CH   # Switzerland
  # - AL   # Albania
  # - BA   # Bosnia and Herzegovina
  # - GB   # Great Britain
  # - ME   # Montenegro
  # - MK   # North Macedonia
  # - NO1  # Norway Zone 1
  # - NO2  # Norway Zone 2
  # - NO3  # Norway Zone 3
  # - NO4  # Norway Zone 4
  # - NO5  # Norway Zone 5
  # - RS   # Serbia
  # - XK   # Kosovo
