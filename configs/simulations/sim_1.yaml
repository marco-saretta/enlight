    amount_file:  TYNDP_2024_National_Trends
    voll:         5000
  industrial:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5001
  household:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5002
  public:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5003
  ev:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
