# ┌─────────────────────────────────────────────────────────────────┐
# │  ENLIGHT Model — Simulation Configuration                       │
# │  Short test run: 2 weeks, rolling horizon                       │
# └─────────────────────────────────────────────────────────────────┘

label: sim_1

# ═══════════════════════════════════════════════════════════════════
#  RUN CONTROL
# ═══════════════════════════════════════════════════════════════════

run:
  mode:              rolling_horizon
  prediction_year:   2040
  plant_aggregation: true

rolling_horizon:
  start_week: 1
  end_week:   2   # 2 weeks for a quick test run

# ═══════════════════════════════════════════════════════════════════
#  PRODUCTION
# ═══════════════════════════════════════════════════════════════════

# ─── Variable Renewables ───────────────────────────────────────────

wind_onshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.01

wind_offshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.02

solar_pv:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.03

hydro_ror:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.04

# ─── Hydro Reservoir ───────────────────────────────────────────────

hydro_res:
  units_file:          hydro_reservoir_units
  energy_weather_year: 2020
  bid_price:           ramboll

# ─── Hydro Pumped Storage ──────────────────────────────────────────

hydro_ps:
  units_file:           hydro_pumped_storage_units
  initial_soc:          0.5
  roundtrip_efficiency: 0.9
  fuel_projection:      ramboll

# ─── Thermal ───────────────────────────────────────────────────────

thermal:
  units_file:      thermal_plant_units
  fuel_projection: ramboll

# ═══════════════════════════════════════════════════════════════════
#  TRANSMISSION
# ═══════════════════════════════════════════════════════════════════

lines:
  capacity_file: entsoe

