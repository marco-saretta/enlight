# ENLIGHT Model - Simulation Configuration Template
#
# Copy this file, rename it (e.g. sim_new.yaml), place it under
# configs/simulations/, then reference it from the CLI:
#
#   python main.py simulations=sim_new

label: sim_template   # written to output metadata; keep it unique

# Run control
run:
  mode:              rolling_horizon   # rolling_horizon | yearly
  prediction_year:   2040              # projection year for capacities and demand
  plant_aggregation: true              # aggregate units by zone+fuel before solving [bool]

rolling_horizon:                       # ignored when mode: yearly
  start_week: 1                        # first week to simulate [1-52]
  end_week:   52                       # last week to simulate  [1-52]

# Production
# Variable renewables
# weather_year  : historical year used for the generation profile
# capacity_file : capacity projection dataset (file stem in data/*/projections/)
# bid_price     : offer price submitted to the market [EUR/MWh]

wind_onshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.01

wind_offshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.02

solar_pv:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.03

hydro_ror:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.04

# Hydro reservoir
# energy_weather_year : historical year for reservoir energy availability
# bid_price           : numeric [EUR/MWh] or ramboll (Ramboll fuel price projection)

hydro_res:
  units_file:          hydro_reservoir_units
  energy_weather_year: 2020
  bid_price:           ramboll

# Hydro pumped storage
# initial_soc          : state-of-charge at t=0 as fraction of storage capacity [0-1]
# roundtrip_efficiency : pump-turbine roundtrip efficiency [0-1]
# fuel_projection      : fuel price dataset used to derive marginal costs

hydro_ps:
  units_file:           hydro_pumped_storage_units
  initial_soc:          0.5
  roundtrip_efficiency: 0.9
  fuel_projection:      ramboll

# Thermal
# fuel_projection : fuel price dataset used to compute marginal costs

thermal:
  units_file:      thermal_plant_units
  fuel_projection: ramboll

# Transmission network
# capacity_file : entsoe uses the ENTSO-E NTC file

lines:
  capacity_file: entsoe

# Demand
# Inflexible demand
# Modelled as a price-inelastic bid at the value of lost load (voll).
# profile_year : historical year used for the demand profile shape
# amount_file  : annual energy projection dataset name
# voll         : value of lost load, maximum bid price [EUR/MWh]

demand_inflexible:
  classical:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5000
  industrial:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5001
  household:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5002
  public:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5003
  ev:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5004

# Flexible demand
# Modelled as a price-elastic bid at the willingness to pay (wtp).
# amount_file   : annual energy projection dataset name
# capacity_file : hourly capacity projection dataset name
# wtp           : willingness to pay, maximum bid price [EUR/MWh]

demand_flexible:
  classical:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  industrial:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  household:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  public:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  ev:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100

# Storage
# Battery energy storage system (BESS)
# initial_soc          : state-of-charge at t=0 as fraction of storage capacity [0-1]
# roundtrip_efficiency : roundtrip efficiency [0-1]

bess:
  units_file:           bess_units
  initial_soc:          0.5
  roundtrip_efficiency: 0.85

# Other demand units

ptx:
  units_file: ptx_units

district_heating:
  units_file: district_heating_units