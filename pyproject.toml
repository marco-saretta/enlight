[project]
name = "enlight"
version = "0.0.1"
description = "European Network for Long-term Insights on Grid prices, Hedging and Trends."
authors = [
  { name = "Marco Saretta (Technical University of Denmark / Ramboll Denmark)", email = "mcsr@dtu.dk" },
]

keywords = ["European market model", "Price forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "xarray>=2024.03.0,<2025.7.0",
    "scipy",
    "tqdm",
    "ipykernel",
    "openpyxl",
    "matplotlib",
    "linopy>=0.4.4",
    "highspy>=1.13.0",
    "yfinance",
    "entsoe-py",
    "gurobipy>=13.0.0",     # Requires installing license locally
    "hydra-core>=1.3.2",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "ruff>=0.15.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff>=0.2.1",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/enlight"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

# if the above build-system does not work
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

