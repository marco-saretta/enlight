[project]
name = "enlight"
version = "0.0.1"
description = "European Network for Long-term Insights on Grid prices, Hedging and Trends."
authors = [
  { name = "Marco Saretta (Technical University of Denmark / Ramboll Denmark)", email = "mcsr@dtu.dk" },
]
keywords = ["European market model", "Price forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hydra-core>=1.3.7",
    "linopy>=0.9.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel",
]

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/enlight"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
