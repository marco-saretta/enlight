# Yearly solve, 2040, TYNDP National Trends

label: sim_2

run:
  mode:              yearly   # rolling_horizon | yearly
  prediction_year:   2040
  plant_aggregation: true     # group units by zone + fuel before solving

rolling_horizon:              # unused in yearly mode — kept for schema consistency
  start_week: 1
  end_week:   52

# Variable renewables — always dispatch at near-zero bid price.
wind_onshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.01   # EUR/MWh

wind_offshore:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.02

solar_pv:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.03

hydro_ror:
  weather_year:  2020
  capacity_file: TYNDP_2024_National_Trends
  bid_price:     0.04

# Dispatchable hydro — bid price derived from Ramboll fuel price projection.
hydro_res:
  units_file:          hydro_reservoir_units
  energy_weather_year: 2020
  bid_price:           ramboll

hydro_ps:
  units_file:           hydro_pumped_storage_units
  initial_soc:          0.5   # fraction of capacity at t=0
  roundtrip_efficiency: 0.9
  fuel_projection:      ramboll

thermal:
  units_file:      thermal_plant_units
  fuel_projection: ramboll

# --- Transmission -------------------------------------------------------------

lines:
  capacity_file: entsoe   # ENTSO-E NTC

# Price-inelastic bids. voll is the maximum bid price [EUR/MWh].
demand_inflexible:
  classical:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5000
  industrial:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5001
  household:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5002
  public:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5003
  ev:
    profile_year: 2020
    amount_file:  TYNDP_2024_National_Trends
    voll:         5004

# Price-elastic bids. wtp is the maximum bid price [EUR/MWh].
demand_flexible:
  classical:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  industrial:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  household:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  public:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100
  ev:
    amount_file:   TYNDP_2024_National_Trends
    capacity_file: TYNDP_2024_National_Trends
    wtp:           100

bess:
  units_file:           bess_units
  initial_soc:          0.5
  roundtrip_efficiency: 0.85

ptx:
  units_file: ptx_units

district_heating:
  units_file: district_heating_units
