  # - FI   # Finland
  - FR   # France
  # - HR   # Croatia
  # - HU   # Hungary
  - IT   # Italy
  # - LT   # Lithuania
  # - LV   # Latvia
  # - NL   # Netherlands
  # - PL   # Poland
  # - PT   # Portugal
  # - RO   # Romania
  # - SE1  # Sweden Zone 1
  # - SE2  # Sweden Zone 2
  # - SE3  # Sweden Zone 3
  # - SE4  # Sweden Zone 4
  # - SEM  # Single Electricity Market (Ireland & Northern Ireland)
  # - SI   # Slovenia
