defaults:
  - paths: default           # file system paths → config/paths/
  - simulations: _template   # active scenario  → config/simulations/
  - entsoe_api_key: placeholder
  - _self_

# highs (open-source, no license) | gurobi (commercial, requires license)
solver: highs

# All active zones must have matching input data under data/.
# Comment out zones to exclude them from the model.
bidding_zones:

  # EU member states
  - AT   # Austria
  - BE   # Belgium
  # - BG   # Bulgaria
  # - CZ   # Czech Republic
  # - DELU # Germany and Luxembourg
