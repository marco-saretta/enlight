# -----------------------------------------------------------------------------
# Generation Technologies
# -----------------------------------------------------------------------------
# Conventional and renewable generation technologies to include in the model.
# Maps display labels to technology identifiers used in data files.
# -----------------------------------------------------------------------------

conventional_generators:
  - label: thermal_plants
    tech: thermal_plants

VRE_generators:
  - label: WIND_ON
    tech: wind_onshore
  
  - label: WIND_OFF
    tech: wind_offshore
  
  - label: SOLAR
    tech: solar_pv
  
  - label: HYDRO_ROR
    tech: hydro_ror