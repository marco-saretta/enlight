# =============================================================================
#                         ENLIGHT Model Configuration
# =============================================================================
# Configuration for ENLIGHT energy market simulations
# =============================================================================


# -----------------------------------------------------------------------------
# Simulation Parameters
# -----------------------------------------------------------------------------
# Define scenarios to simulate. Each scenario must have a corresponding 
# directory with required input data files.
# -----------------------------------------------------------------------------

scenario_list:
  - scenario_1:
      label: "scenario_1"
      run_mode: "yearly"
      year: 2030
      plant_aggregation: true

  - scenario_2:
      label: "scenario_2"
      run_mode: "yearly"
      year: 2030
      plant_aggregation: false

  - scenario_3:
      label: "scenario_3"
      run_mode: "weekly"
      year: 2040
      plant_aggregation: true
      week_range:
        start_week: 1
        end_week: 2         # 52 for full year
  
  - scenario_4:
      label: "scenario_4"
      run_mode: "weekly"
      year: 2040
      plant_aggregation: false
      week_range:
        start_week: 1
        end_week: 2         # 52 for full year


# -----------------------------------------------------------------------------
# Solver Configuration
# -----------------------------------------------------------------------------
# Selects optimization solver for energy market problems.
# "gurobi": High performance commercial solver, requires license
# "highs": Open-source alternative, no license required
# -----------------------------------------------------------------------------

solver_name: "gurobi"  # Options: "gurobi", "highs"


# -----------------------------------------------------------------------------
